name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 必须先拉取你当前的仓库代码
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 这里的 ref 最好填你目标分支的名字，比如 main
          ref: main

      # 2. 再执行同步动作
      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: lerdb/HotDownloader      # 例如：apache/airflow (上游仓库)
          upstream_sync_branch: main          # 上游的分支名（英文）
          target_sync_branch: main            # 你自己的分支名（英文，通常是 main）
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
